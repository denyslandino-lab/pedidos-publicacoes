<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pedidos de Publicações</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0E17">
<style>
  @font-face{
    font-family:'JetBrains Mono';
    src:local('JetBrains Mono');
  }
  :root{
    --bg-0:#080B12;
    --bg-1:#0D121D;
    --surface:rgba(255,255,255,0.045);
    --surface-hi:rgba(255,255,255,0.075);
    --border:rgba(148,163,196,0.16);
    --border-hi:rgba(148,163,196,0.30);
    --ink:#E7ECF6;
    --ink-soft:#8A93AB;
    --ink-faint:#5C6478;
    --cyan:#49E2CE;
    --cyan-dim:rgba(73,226,206,0.14);
    --violet:#8B7CF6;
    --amber:#F5A962;
    --amber-dim:rgba(245,169,98,0.14);
    --red:#FB7A83;
    --radius:16px;
    --mono:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html{background:var(--bg-0);}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 800px 500px at 15% -5%, rgba(139,124,246,0.16), transparent 60%),
      radial-gradient(ellipse 700px 480px at 100% 15%, rgba(73,226,206,0.14), transparent 55%),
      radial-gradient(ellipse 900px 600px at 50% 120%, rgba(73,226,206,0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-0));
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-bottom:88px;
    position:relative;
  }
  body::before{
    content:'';
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(rgba(148,163,196,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,196,0.05) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:radial-gradient(ellipse 600px 400px at 50% 0%, black, transparent 70%);
    z-index:0;
  }
  header, .toolbar, main, .footer-link, .sheet-bg{position:relative;z-index:1;}

  header{
    padding:30px 20px 16px;
  }
  header h1{
    margin:0;
    font-size:21px;
    font-weight:700;
    letter-spacing:-0.2px;
    color:var(--ink);
  }
  header p{
    margin:5px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }

  .toolbar{
    display:flex;
    gap:6px;
    padding:16px 20px 0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    margin:16px 20px 0;
    padding:4px;
  }
  .toolbar button{
    flex:1;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    padding:9px 6px;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:var(--sans);
    transition:background 0.15s, color 0.15s;
  }
  .toolbar button.active{
    background:var(--cyan-dim);
    color:var(--cyan);
  }

  main{padding:16px 20px 0;}

  .empty{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-faint);
  }
  .empty .mark{
    font-family:var(--mono);
    font-size:28px;
    color:var(--ink-faint);
    margin-bottom:10px;
    opacity:0.6;
  }

  .card{
    background:var(--surface);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-left:2px solid var(--border-hi);
    border-radius:var(--radius);
    padding:15px 17px;
    margin-bottom:12px;
    position:relative;
  }
  .card:has(.status.pendente){border-left-color:var(--amber);}
  .card:has(.status.entregue){border-left-color:var(--cyan);}
  .card .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card .pub{
    font-size:15.5px;
    font-weight:600;
    color:var(--ink);
    line-height:1.35;
    letter-spacing:-0.1px;
  }
  .card .publicador{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:3px;
    font-family:var(--mono);
  }
  .status{
    font-family:var(--mono);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.3px;
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
    border:1px solid transparent;
  }
  .status.pendente{background:var(--amber-dim);color:var(--amber);border-color:rgba(245,169,98,0.25);}
  .status.entregue{background:var(--cyan-dim);color:var(--cyan);border-color:rgba(73,226,206,0.25);}

  .dates{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--ink-faint);
    display:grid;
    grid-template-columns:1fr 1fr;
    row-gap:8px;
  }
  .dates div b{
    display:block;
    color:var(--ink-soft);
    font-size:12.5px;
    font-weight:500;
    font-family:var(--mono);
    margin-top:2px;
  }

  .card .actions{
    margin-top:13px;
    display:flex;
    gap:8px;
  }
  .card .actions button{
    flex:1;
    border:1px solid transparent;
    border-radius:9px;
    padding:9px 0;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    font-family:var(--sans);
  }
  .btn-deliver{background:var(--cyan);color:#04211E;}
  .btn-edit{background:transparent;color:var(--ink-soft);border-color:var(--border-hi)!important;}
  .btn-del{background:transparent;color:var(--red);border-color:rgba(251,122,131,0.25)!important;}

  .fab{
    position:fixed;
    right:20px;
    bottom:24px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--cyan), var(--violet));
    color:#081019;
    border:none;
    font-size:26px;
    font-weight:600;
    line-height:56px;
    text-align:center;
    box-shadow:0 8px 24px rgba(73,226,206,0.35), 0 0 0 1px rgba(255,255,255,0.1) inset;
    cursor:pointer;
    z-index:2;
  }

  .sheet-bg{
    display:none;
    position:fixed;inset:0;
    background:rgba(4,6,10,0.65);
    backdrop-filter:blur(4px);
    z-index:20;
  }
  .sheet-bg.show{display:block;}
  .sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--bg-1);
    border:1px solid var(--border);
    border-bottom:none;
    box-shadow:0 -20px 60px rgba(0,0,0,0.5);
    border-radius:20px 20px 0 0;
    padding:22px 20px 28px;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h2{
    margin:0 0 18px;
    font-size:18px;
    font-weight:700;
    color:var(--ink);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
    font-family:var(--mono);
    letter-spacing:0.2px;
  }
  .field input{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:15px;
    background:rgba(255,255,255,0.03);
    color:var(--ink);
    font-family:var(--sans);
    color-scheme:dark;
  }
  .field input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim);}
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:8px;
  }
  .sheet-actions button{
    flex:1;
    padding:13px 0;
    border-radius:10px;
    border:1px solid transparent;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:var(--sans);
  }
  .btn-save{background:linear-gradient(135deg, var(--cyan), #38C6B4);color:#04211E;}
  .btn-cancel{background:transparent;color:var(--ink-soft);border-color:var(--border-hi)!important;}

  .footer-link{
    text-align:center;
    padding:22px 20px 0;
    font-size:12px;
    color:var(--ink-faint);
  }
  .footer-link span{
    text-decoration:underline;
    text-decoration-color:var(--border-hi);
    text-underline-offset:3px;
    cursor:pointer;
    font-family:var(--mono);
  }
</style>
</head>
<body>

<header>
  <h1>Pedidos de Publicações</h1>
  <p>Controle de pedidos do Salão do Reino</p>
</header>

<div class="toolbar">
  <button id="tab-pendente" class="active">Pendentes</button>
  <button id="tab-entregue">Entregues</button>
  <button id="tab-todos">Todos</button>
</div>

<main id="list"></main>

<div class="footer-link"><span id="backup-link">exportar / importar backup</span></div>

<button class="fab" id="btn-new">+</button>

<div class="sheet-bg" id="sheet-bg">
  <div class="sheet">
    <h2 id="sheet-title">Novo pedido</h2>
    <div class="field">
      <label>Publicação pedida</label>
      <input id="f-pub" type="text" placeholder="Ex.: A Sentinela — edição de estudo">
    </div>
    <div class="field">
      <label>Nome do publicador</label>
      <input id="f-nome" type="text" placeholder="Nome de quem pediu">
    </div>
    <div class="field">
      <label>Data do pedido do publicador</label>
      <input id="f-data-pub" type="date">
    </div>
    <div class="field">
      <label>Data do pedido no site</label>
      <input id="f-data-site" type="date">
    </div>
    <div class="field">
      <label>Data de entrega ao publicador</label>
      <input id="f-data-entrega" type="date">
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="btn-cancel">Cancelar</button>
      <button class="btn-save" id="btn-save">Salvar</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'pedidos-publicacoes-v1';
let editingId = null;
let filter = 'pendente';

function load(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function save(items){
  localStorage.setItem(STORE_KEY, JSON.stringify(items));
}
function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function render(){
  const items = load();
  const list = document.getElementById('list');
  let shown = items;
  if(filter === 'pendente') shown = items.filter(i => !i.dataEntrega);
  if(filter === 'entregue') shown = items.filter(i => !!i.dataEntrega);

  shown = shown.slice().sort((a,b) => {
    // pendentes mais antigos primeiro, entregues mais recentes primeiro
    if(filter === 'entregue') return (b.dataEntrega||'').localeCompare(a.dataEntrega||'');
    return (a.dataSite||a.dataPub||'').localeCompare(b.dataSite||b.dataPub||'');
  });

  if(shown.length === 0){
    const msg = filter === 'entregue' ? 'Nenhum pedido entregue ainda.' :
                filter === 'pendente' ? 'Nenhum pedido pendente. Tudo em dia.' :
                'Nenhum pedido cadastrado.';
    list.innerHTML = `<div class="empty"><div class="mark">·</div>${msg}</div>`;
    return;
  }

  list.innerHTML = shown.map(i => `
    <div class="card">
      <div class="top">
        <div>
          <div class="pub">${escapeHtml(i.publicacao)}</div>
          <div class="publicador">${escapeHtml(i.nome)}</div>
        </div>
        <div class="status ${i.dataEntrega ? 'entregue' : 'pendente'}">${i.dataEntrega ? 'Entregue' : 'Pendente'}</div>
      </div>
      <div class="dates">
        <div>Pedido do publicador<b>${fmtDate(i.dataPub)}</b></div>
        <div>Pedido no site<b>${fmtDate(i.dataSite)}</b></div>
        <div>Entrega ao publicador<b>${fmtDate(i.dataEntrega)}</b></div>
      </div>
      <div class="actions">
        ${!i.dataEntrega ? `<button class="btn-deliver" data-act="deliver" data-id="${i.id}">Marcar entregue</button>` : ''}
        <button class="btn-edit" data-act="edit" data-id="${i.id}">Editar</button>
        <button class="btn-del" data-act="del" data-id="${i.id}">Excluir</button>
      </div>
    </div>
  `).join('');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('list').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  const id = btn.dataset.id;
  const act = btn.dataset.act;
  const items = load();
  const item = items.find(i => i.id === id);
  if(!item) return;

  if(act === 'deliver'){
    const today = new Date().toISOString().slice(0,10);
    item.dataEntrega = today;
    save(items);
    render();
  } else if(act === 'del'){
    if(confirm(`Excluir o pedido de "${item.publicacao}" para ${item.nome}?`)){
      save(items.filter(i => i.id !== id));
      render();
    }
  } else if(act === 'edit'){
    openSheet(item);
  }
});

document.querySelectorAll('.toolbar button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.toolbar button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    filter = b.id.replace('tab-','');
    render();
  });
});

function openSheet(item){
  editingId = item ? item.id : null;
  document.getElementById('sheet-title').textContent = item ? 'Editar pedido' : 'Novo pedido';
  document.getElementById('f-pub').value = item ? item.publicacao : '';
  document.getElementById('f-nome').value = item ? item.nome : '';
  document.getElementById('f-data-pub').value = item ? (item.dataPub||'') : '';
  document.getElementById('f-data-site').value = item ? (item.dataSite||'') : '';
  document.getElementById('f-data-entrega').value = item ? (item.dataEntrega||'') : '';
  document.getElementById('sheet-bg').classList.add('show');
}
function closeSheet(){
  document.getElementById('sheet-bg').classList.remove('show');
  editingId = null;
}

document.getElementById('btn-new').addEventListener('click', () => openSheet(null));
document.getElementById('btn-cancel').addEventListener('click', closeSheet);
document.getElementById('sheet-bg').addEventListener('click', e => {
  if(e.target.id === 'sheet-bg') closeSheet();
});

document.getElementById('btn-save').addEventListener('click', () => {
  const publicacao = document.getElementById('f-pub').value.trim();
  const nome = document.getElementById('f-nome').value.trim();
  const dataPub = document.getElementById('f-data-pub').value;
  const dataSite = document.getElementById('f-data-site').value;
  const dataEntrega = document.getElementById('f-data-entrega').value;

  if(!publicacao || !nome){
    alert('Preencha ao menos a publicação e o nome do publicador.');
    return;
  }

  const items = load();
  if(editingId){
    const item = items.find(i => i.id === editingId);
    Object.assign(item, {publicacao, nome, dataPub, dataSite, dataEntrega});
  } else {
    items.push({id: uid(), publicacao, nome, dataPub, dataSite, dataEntrega});
  }
  save(items);
  closeSheet();
  render();
});

document.getElementById('backup-link').addEventListener('click', () => {
  const choice = confirm('OK para exportar um backup. Cancelar para importar um backup existente.');
  if(choice){
    const data = JSON.stringify(load(), null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pedidos-publicacoes-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  } else {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = () => {
      const file = input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const imported = JSON.parse(reader.result);
          if(!Array.isArray(imported)) throw new Error();
          if(confirm(`Importar ${imported.length} pedido(s)? Isso vai substituir os dados atuais.`)){
            save(imported);
            render();
          }
        }catch(e){
          alert('Arquivo inválido.');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

render();
</script>
</body>
</html>
